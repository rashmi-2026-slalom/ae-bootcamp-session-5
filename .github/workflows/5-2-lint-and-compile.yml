name: Step 5-2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/agentic-workflow

permissions:
  contents: read
  actions: write
  issues: write

env:
  CURRENT_STEP: '5-2'
  NEXT_STEP: '5-3'
  STEP_FILE: '.github/steps/5-2-lint-and-compile.md'

jobs:
  validate_step:
    name: Validate Tests Pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run all tests
        id: test
        run: npm test

  find_exercise:
    name: Find Exercise Issue
    runs-on: ubuntu-latest
    outputs:
      issue-url: ${{ steps.find-or-create.outputs.issue-url }}
      issue-number: ${{ steps.find-or-create.outputs.issue-number }}
    steps:
      - name: Find exercise by issue title
        id: find-or-create
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE_TEXT: Exercise
          DEFAULT_EXERCISE_TITLE: "Exercise: AI Coding Assistant Enablement Bootcamp Session 5"
        with:
          script: |
            const response = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 100
            });

            const issues = response.data.filter(item => !item.pull_request);
            let issue = issues.find(item => item.title.includes(process.env.ISSUE_TITLE_TEXT));

            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: process.env.DEFAULT_EXERCISE_TITLE,
                body: 'Auto-created to continue Step 5-2 workflow automation.'
              });
              issue = created.data;
            } else if (issue.state === 'closed') {
              const reopened = await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'open'
              });
              issue = reopened.data;
            }

            core.info(`Exercise issue found: #${issue.number} (${issue.html_url})`);
            core.setOutput('issue-url', issue.html_url);
            core.setOutput('issue-number', issue.number);

  post_success:
    name: Post success comment
    needs: [validate_step, find_exercise]
    if: success()
    runs-on: ubuntu-latest
    env:
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.4.0

      - name: Build comment - add step content
        id: build-comment
        uses: skills/action-text-variables@v2
        with:
          template-file: ${{ env.STEP_FILE }}
          template-vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Post success and next step
        run: |
          gh issue comment "$ISSUE_URL" --body "✅ **Step ${{ env.CURRENT_STEP }} Complete!** All tests passing. Now let's clean up the code quality!

          $STEP_CONTENT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEP_CONTENT: ${{ steps.build-comment.outputs.updated-text }}

      - name: Disable current workflow
        run: |
          gh workflow disable "Step ${{ env.CURRENT_STEP }}" || echo "Failed to disable Step ${{ env.CURRENT_STEP }} or it's already disabled"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable next workflow
        run: |
          gh workflow enable "Step ${{ env.NEXT_STEP }}" || echo "Failed to enable Step ${{ env.NEXT_STEP }} or it's already enabled"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
